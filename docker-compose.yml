services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: portfolio }
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    volumes:
      - ./backend/app:/code/app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/portfolio
      ALLOWED_ORIGINS: "*"
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8000 }
    ports: ["8080:80"]
    depends_on: [backend]
volumes: { pgdata: {} }
